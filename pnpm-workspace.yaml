packages:
  - frontend
  - backend

# pnpm 默认阻止依赖的安装脚本。这里显式放行确有构建需求的包：
# argon2 / Prisma 需要本地二进制或引擎，esbuild 需要安装平台二进制。
allowBuilds:
  argon2: true
  esbuild: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # 遥测包，不需要执行安装脚本。
  '@scarf/scarf': false
  # 本地文件监听 / 原生解析器：需要安装平台二进制。
  '@parcel/watcher': true
  unrs-resolver: true
  # 可选原生加速与 Cloudflare 运行时：本项目不使用，跳过安装脚本。
  msgpackr-extract: false
  workerd: false
